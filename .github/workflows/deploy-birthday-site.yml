name: Deploy birthday website

on:
  push:
    branches:
      - main
    paths:
      - birthday-surprise/**
      - .github/workflows/deploy-birthday-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: birthday-surprise/package-lock.json

      - name: Install dependencies
        working-directory: birthday-surprise
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website
        working-directory: birthday-surprise
        run: npm run build -- --base-href /source/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: birthday-surprise/dist/birthday-surprise/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
